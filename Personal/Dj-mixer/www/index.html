<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>DJ Mixer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <h1>DJ Mixer</h1>

    <section class="search-bar">
      <div class="search-input-row">
        <input type="text" id="search-input" placeholder="Search YouTube..." />
        <button id="search-button">Search</button>
      </div>
      <div id="search-results"></div>
    </section>

    <div class="decks">
      <!-- Deck A -->
      <section class="deck" id="deck-A">
        <div class="disc-wrap">
          <div class="disc" id="disc-A">
            <div class="disc-hole"></div>
          </div>
        </div>
        <div class="player-visible" id="player-A"></div>

        <div class="track-info" id="title-A">No track loaded</div>
        <div class="status-text" id="status-A"></div>

        <input type="range" id="progress-A" min="0" max="100" value="0" class="progress-slider" />
        <div class="time-text" id="time-A">0:00 / 0:00</div>

        <input type="text" id="input-A" placeholder="Or paste YouTube link/ID" />
        <div class="deck-buttons">
          <button id="load-A">Load</button>
          <button id="playpause-A">Play</button>
        </div>
        <label class="vol-label">
          Volume
          <input type="range" id="volume-A" min="0" max="100" value="80" />
        </label>
      </section>

      <!-- Deck B -->
      <section class="deck" id="deck-B">
        <div class="disc-wrap">
          <div class="disc" id="disc-B">
            <div class="disc-hole"></div>
          </div>
        </div>
        <div class="player-visible" id="player-B"></div>

        <div class="track-info" id="title-B">No track loaded</div>
        <div class="status-text" id="status-B"></div>

        <input type="range" id="progress-B" min="0" max="100" value="0" class="progress-slider" />
        <div class="time-text" id="time-B">0:00 / 0:00</div>

        <input type="text" id="input-B" placeholder="Or paste YouTube link/ID" />
        <div class="deck-buttons">
          <button id="load-B">Load</button>
          <button id="playpause-B">Play</button>
        </div>
        <label class="vol-label">
          Volume
          <input type="range" id="volume-B" min="0" max="100" value="80" />
        </label>
      </section>
    </div>

    <div class="fade-buttons">
      <button id="fade-to-A">Fade to A</button>
      <button id="fade-to-B">Fade to B</button>
    </div>

    <div class="crossfader-wrap">
      <span>A</span>
      <input type="range" id="crossfader" min="0" max="100" value="50" />
      <span>B</span>
    </div>

    <div class="shortcuts-legend">
      Shortcuts: 1 / 2 play-pause A / B &middot; [ ] volume A &middot; , . volume B &middot; arrows crossfade
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/youtube-api.js"></script>
  <script src="js/metadata.js"></script>
  <script src="js/search.js"></script>
  <script src="js/session.js"></script>
  <script src="js/controller-input.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/ui-controls.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
